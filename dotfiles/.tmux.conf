# ~/.tmux.conf — symlinked from os-config/dotfiles/.tmux.conf

# ---- prefix ----------------------------------------------------------------
# Free up C-b (clashes with readline). C-a is easier to reach.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ---- general ---------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # true color
set -g history-limit 50000
set -g base-index 1                          # window numbers start at 1
setw -g pane-base-index 1                    # pane numbers start at 1
set -g renumber-windows on                   # renumber when a window closes
set -s escape-time 0                         # no delay on escape (vim friendly)
set -g focus-events on
set -g mouse on

# ---- key bindings ----------------------------------------------------------
# Reload config
bind r source-file ~/.tmux.conf \; display "reloaded"

# Splits keep the current pane's directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation (prefix h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Repeatable resize (prefix H/J/K/L, hold for repeat)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Sessionizer: prefix+f → fzf-pick a project, attach/switch to its session
bind f run-shell "tmux neww ~/.local/bin/sessionizer"

# ---- copy mode (vi-style) --------------------------------------------------
setw -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel

# ---- status bar ------------------------------------------------------------
set -g status-position bottom
set -g status-style "bg=default fg=colour244"
set -g status-left "#[fg=colour39,bold]#S#[default] "
set -g status-right "#[fg=colour244]%H:%M  %d-%b "
set -g status-left-length 30
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #[fg=colour39,bold]#I:#W#[default] "

# ---- plugins (tpm) ---------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

# Install plugins: launch tmux, hit `prefix + I`. Or run:
#   ~/.tmux/plugins/tpm/bin/install_plugins

# Initialize tpm — keep this line last.
run '~/.tmux/plugins/tpm/tpm'
